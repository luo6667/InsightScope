g('statsA:', JSON.stringify({total:sa.total, pos:sa.sentiment.pos, neu:sa.sentiment.neu, neg:sa.sentiment.neg}));\n  console.log('statsB:', JSON.stringify({total:sb.total, pos:sb.sentiment.pos, neu:sb.sentiment.neu, neg:sb.sentiment.neg}));\n  console.log('statsFull:', JSON.stringify({total:full.total, pos:full.sentiment.pos, neu:full.sentiment.neu, neg:full.sentiment.neg}));\n})().catch(e=>{console.error('FAILED',e);process.exit(1);});\n\" 2>&1; \"---comment time range in mysql---\"; $env:MYSQL_PWD=\"1234\"; mysql -h 127.0.0.1 -u root insight -e \"SELECT MIN(timestamp) mn, MAX(timestamp) mx, COUNT(*) n FROM comments WHERE datasetId='5';\" 2>&1)", "Bash($env:MYSQL_PWD=\"1234\"; mysql -h 127.0.0.1 -u root insight -e \"SELECT COUNT(*) AS in_A FROM comments WHERE datasetId='5' AND timestamp BETWEEN '2026-08-09 16:00:00' AND '2026-08-17 15:59:59'; SELECT COUNT(*) AS in_B FROM comments WHERE datasetId='5' AND timestamp BETWEEN '2026-08-02 16:00:00' AND '2026-08-09 15:59:59';\" 2>&1; \"---\"; node -e \"\nconst base='http://localhost:5176';\n(async()=>{\n  const r=await fetch(base+'/api/datasets/5/stats?from=2026-08-15T00:00:00&to=2026-08-15T23:59:59');\n  const s=await r.json();\n  console.log('single-day stats total:', s.total);\n})();\n\" 2>&1)", "Bash(cd server; npx tsx -e \"\nimport { Op } from 'sequelize';\nimport { initDb, sequelize } from './src/db.js';\nimport { CommentModel } from './src/models.js';\n(async () => {\n  await initDb();\n  const tf = { timestamp: { [Op.gte]: new Date('2026-08-15T00:00:00'), [Op.lte]: new Date('2026-08-15T23:59:59') } };\n  const q = CommentModel.count({ where: { datasetId: '5', ...tf } });\n  console.log('SQL:', q.toString());\n  console.log('count:', await q);\n  await sequelize.close();\n})();\n\" 2>&1)", "Bash(cd server; npx tsx debug-filter.ts 2>&1)", "Bash(Get-NetTCPConnection -LocalPort 5176 -State Listen -ErrorAction SilentlyContinue | Select-Object LocalPort,OwningProcess; Get-Process -Id (Get-NetTCPConnection -LocalPort 517